name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: lint, vet, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check module tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: |
          CGO_ENABLED=0 go build -ldflags "-X main.version=dev" ./cmd/agent
          CGO_ENABLED=0 go build -ldflags "-X main.version=dev" ./cmd/server

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint Helm chart
        run: helm lint helm

      - name: Render Helm chart
        run: |
          helm template heimdall helm --namespace default > rendered.yaml
          helm template heimdall helm --namespace default \
            --set clickhouse.enabled=false \
            --set server.config.clickhouseAddr=clickhouse.example:9000 > rendered-external-clickhouse.yaml
          ! grep -Eq 'image:.*(heimdall-agent|heimdall-server):latest' rendered.yaml
          grep -Eq 'image:.*heimdall-agent:v[0-9]' rendered.yaml
          grep -Eq 'image:.*heimdall-server:v[0-9]' rendered.yaml
