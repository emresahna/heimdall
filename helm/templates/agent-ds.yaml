apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "heimdall.fullname" . }}-agent
  labels:
    {{- include "heimdall.labels" . | nindent 4 }}
    component: agent
spec:
  selector:
    matchLabels:
      {{- include "heimdall.selectorLabels" . | nindent 6 }}
      component: agent
  template:
    metadata:
      labels:
        {{- include "heimdall.selectorLabels" . | nindent 8 }}
        component: agent
    spec:
      hostPID: true
      serviceAccountName: {{ include "heimdall.serviceAccountName" . }}-agent
      containers:
      - name: agent
        image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.agent.image.pullPolicy | default "IfNotPresent" }}
        securityContext:
          privileged: true
        env:
        - name: SERVER_ADDR
          value: "{{ include "heimdall.fullname" . }}-server:50051"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_ENRICH
          value: "true"
        {{- range $key, $val := .Values.agent.env }}
        - name: {{ $key }}
          value: {{ $val | quote }}
        {{- end }}
        volumeMounts:
        - name: debugfs
          mountPath: /sys/kernel/debug
        - name: bpffs
          mountPath: /sys/fs/bpf
        resources:
          {{- toYaml .Values.agent.resources | nindent 10 }}
      volumes:
      - name: debugfs
        hostPath:
          path: /sys/kernel/debug
      - name: bpffs
        hostPath:
          path: /sys/fs/bpf
