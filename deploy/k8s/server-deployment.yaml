apiVersion: apps/v1
kind: Deployment
metadata:
  name: heimdall-server
  namespace: default
  labels:
    app: heimdall-server
    component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heimdall-server
  template:
    metadata:
      labels:
        app: heimdall-server
    spec:
      containers:
      - name: server
        image: ghcr.io/emresahna/heimdall-server:v0.1.0
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        env:
        - name: CLICKHOUSE_ADDR
          value: "clickhouse:9000"
        - name: CLICKHOUSE_DB
          value: "heimdall_logs"
        - name: CLICKHOUSE_USER
          value: "heimdall_user"
        - name: CLICKHOUSE_PASSWORD
          value: "heimdall_password"
        - name: PORT
          value: "50051"
        - name: HTTP_PORT
          value: "8080"
        ports:
        - containerPort: 50051
        - containerPort: 8080
        readinessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: heimdall-server
  namespace: default
spec:
  selector:
    app: heimdall-server
  ports:
  - port: 50051
    name: grpc
    targetPort: 50051
  - port: 8080
    name: http
    targetPort: 8080
